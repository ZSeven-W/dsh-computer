name: ci

on:
  pull_request:
  push:
    branches: [main]

# native/Package.swift declares swift-tools-version 6.0. The macos-14 image
# ships Swift 5.10, so `swift build` there dies with "package is using Swift
# tools version 6.0.0 but the installed version is 5.10.0" before any test
# runs — which is why this workflow has been red on macOS. macos-15 ships
# Swift 6. Bumping the image is the fix; lowering the tools version would
# give up the 6.0 language mode the helper is written against.
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            node: '24.11.0'
          - os: macos-15
            node: '26'
          - os: ubuntu-latest
            node: '24.11.0'
          - os: windows-latest
            node: '24.11.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Import the built plugin entry
        run: node --input-type=module -e "await import('./lib/index.js')"
      - name: Smoke the packed install
        run: pnpm run smoke:pack
