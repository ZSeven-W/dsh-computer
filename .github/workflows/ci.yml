name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            node: '24.11.0'
          - os: macos-14
            node: '26'
          - os: ubuntu-latest
            node: '24.11.0'
          - os: windows-latest
            node: '24.11.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Import the built plugin entry
        run: node --input-type=module -e "await import('./lib/index.js')"
      - name: Smoke the packed install
        run: pnpm run smoke:pack
